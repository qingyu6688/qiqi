name: Build Desktop Client

# 正式版本不可覆盖，修复后递增版本并推送新标签。
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['.github/workflows/tauri-release.yml']

permissions:
  contents: write

concurrency:
  group: qiqi-desktop-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'qingyu6688/qiqi'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 检查发布版本和签名配置
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:SIGNING_KEY -or !$env:SIGNING_PASSWORD) { throw '缺少桌面更新签名密钥或密码' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw '正式发布只接受 x.y.z 稳定版本' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw '标签与项目版本不一致' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '无法检查已有发布' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and ($releases | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME })) { throw '该版本已存在，请使用新版本号，禁止覆盖' }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖并运行回归测试
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test -- --maxWorkers=4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 先生成内嵌资源，之后的 Rust 测试也使用同一桌面配置。
      - name: 构建并签名 Windows 安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --bundles nsis --ci

      - name: 检查 Rust 逻辑和发布产物
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --release --lib --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          npm run release:prepare -- --tag "v$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传已验签的桌面发布文件
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '发布前无法核对最新版本' }
          foreach ($release in $releases) {
            if (!$release.draft -and !$release.prerelease -and $release.tag_name -match '^v(\d+\.\d+\.\d+)$') {
              if ([version]$Matches[1] -ge [version]$version) { throw '已有相同或更高正式版本，禁止倒退更新通道' }
            }
          }
          $installer = "release-artifacts/qiqi_${version}_x64-setup.exe"
          $assets = @($installer, "$installer.sig", 'release-artifacts/latest.json', 'release-artifacts/SHA256SUMS', 'release-artifacts/release-notes.md')
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title $env:GITHUB_REF_NAME --notes-file release-artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
